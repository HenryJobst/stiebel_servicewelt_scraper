name: Auto-merge Dependency PRs

on:
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  merge-prs:
    name: Merge eligible dependency PRs
    runs-on: ubuntu-latest
    steps:
      - name: Process and merge PRs
        id: process
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import subprocess, json, os

          repo = os.environ['REPO']

          result = subprocess.run(
            ['gh', 'pr', 'list', '--repo', repo, '--state', 'open',
             '--json', 'number,title,labels,mergeable,statusCheckRollup', '--limit', '50'],
            capture_output=True, text=True, check=True
          )
          prs = json.loads(result.stdout)

          failed, merged, skipped = [], [], []

          for pr in prs:
            labels = {l['name'] for l in pr['labels']}

            # Nur Renovate/Dependabot-PRs
            if not (labels & {'renovate', 'dependencies'}):
              continue
            # Major-Updates niemals automatisch mergen
            if 'major-update' in labels:
              skipped.append(f'#{pr["number"]}: {pr["title"]} (major-update)')
              continue

            nr, title = pr['number'], pr['title']
            checks = pr['statusCheckRollup']

            if pr['mergeable'] != 'MERGEABLE':
              print(f'PR #{nr}: nicht mergeable ({pr["mergeable"]}), übersprungen')
              skipped.append(f'#{nr}: {title} (nicht mergeable)')
              continue

            if any(c.get('conclusion') == 'FAILURE' or c.get('state') == 'FAILURE' for c in checks):
              print(f'PR #{nr}: CI-Fehler')
              failed.append(f'#{nr}: {title}')
              continue

            if any(c.get('status') in ('IN_PROGRESS', 'QUEUED') for c in checks):
              print(f'PR #{nr}: Checks laufen noch, übersprungen')
              skipped.append(f'#{nr}: {title} (Checks laufen)')
              continue

            print(f'Merge PR #{nr}: {title}')
            r = subprocess.run(
              ['gh', 'pr', 'merge', str(nr), '--repo', repo, '--merge', '--delete-branch'],
              capture_output=True, text=True
            )
            if r.returncode == 0:
              merged.append(f'#{nr}: {title}')
            else:
              print(f'Merge fehlgeschlagen: {r.stderr}')
              failed.append(f'#{nr}: {title} (merge-Fehler)')

          def section(name):
            delim = f'AUTOMERGE_OUTPUT_{name.upper()}_7f3b9a1d'
            return delim

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            for name, items in (('merged', merged), ('failed', failed), ('skipped', skipped)):
              delim = section(name)
              f.write(f'{name}<<{delim}\n')
              f.write('\n'.join(items) + '\n')
              f.write(f'{delim}\n')

          print(f'Gemergt: {len(merged)}, Fehlgeschlagen: {len(failed)}, Übersprungen: {len(skipped)}')
          PYEOF

      - name: Job-Summary schreiben
        if: always()
        env:
          MERGED: ${{ steps.process.outputs.merged }}
          FAILED: ${{ steps.process.outputs.failed }}
          SKIPPED: ${{ steps.process.outputs.skipped }}
        run: |
          {
            echo "## Dependency-PR-Merge-Ergebnis"
            echo ""
            echo "### Gemergt"
            if [ -n "$MERGED" ]; then echo "$MERGED" | sed 's/^/- /'; else echo "_keine_"; fi
            echo ""
            echo "### CI-Fehler (nicht gemergt)"
            if [ -n "$FAILED" ]; then echo "$FAILED" | sed 's/^/- /'; else echo "_keine_"; fi
            echo ""
            echo "### Übersprungen (Major-Update / Checks laufen / nicht mergeable)"
            if [ -n "$SKIPPED" ]; then echo "$SKIPPED" | sed 's/^/- /'; else echo "_keine_"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  check-security:
    name: Prüfe offene Security-PRs
    runs-on: ubuntu-latest
    steps:
      - name: Security-PRs suchen und in Job-Summary schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import subprocess, json, os

          repo = os.environ['REPO']
          result = subprocess.run(
            ['gh', 'pr', 'list', '--repo', repo, '--state', 'open',
             '--label', 'security', '--json', 'number,title', '--limit', '50'],
            capture_output=True, text=True, check=True
          )
          prs = json.loads(result.stdout)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
            f.write('## Offene Security-PRs\n\n')
            if prs:
              for p in prs:
                f.write(f'- #{p["number"]}: {p["title"]}\n')
            else:
              f.write('_keine_\n')
          PYEOF
